[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streetsight"
version = "0.2.0"
description = "Find the Street View panorama most likely to show a target, using building, canopy and FCC tower-height data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.32,<3",
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "shapely>=2.0,<3",
    "pyproj>=3.7,<4",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "pyarrow>=14",
    "rasterio>=1.4,<2",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
test = ["pytest>=8"]

[project.scripts]
streetsight = "streetsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
